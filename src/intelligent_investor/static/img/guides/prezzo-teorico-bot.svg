<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" style="width:100%;max-width:560px;display:block;font-family:sans-serif">

  <!-- Griglia orizzontale -->
  <line x1="55" y1="18"  x2="530" y2="18"  stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="55" y1="75"  x2="530" y2="75"  stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="55" y1="131" x2="530" y2="131" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Assi -->
  <line x1="55" y1="15"  x2="55"  y2="215" stroke="#aaa" stroke-width="1.5"/>
  <line x1="55" y1="215" x2="530" y2="215" stroke="#aaa" stroke-width="1.5"/>

  <!-- Etichette asse Y -->
  <text x="48" y="22"  text-anchor="end" font-size="11" fill="#57606a">100</text>
  <text x="48" y="79"  text-anchor="end" font-size="11" fill="#57606a">98,5</text>
  <text x="48" y="135" text-anchor="end" font-size="11" fill="#57606a">97,5</text>

  <!-- Retta prezzo teorico: (55,131)=97,50 → (530,18)=100 -->
  <line x1="55" y1="131" x2="530" y2="18" stroke="#3b82d4" stroke-width="2.2"/>

  <!-- Punto emissione -->
  <circle cx="55" cy="131" r="5" fill="#3b82d4"/>
  <text x="60" y="148" font-size="11" fill="#3b82d4" font-weight="600">Emissione (97,50)</text>

  <!-- Punto acquisto a +30gg: x=55+(30/365)*475≈94  y=131-(30/365)*113≈122 -->
  <line x1="94" y1="122" x2="94" y2="215" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="94" cy="122" r="5" fill="#f59e0b"/>
  <text x="98" y="112" font-size="11" fill="#c97d00" font-weight="600">Acquisto (97,71)</text>
  <text x="82" y="228" font-size="10" fill="#57606a">+30 gg</text>

  <!-- Punto vendita anticipata a +200gg: x=55+(200/365)*475≈315  y=131-(200/365)*113≈69 -->
  <line x1="315" y1="69" x2="315" y2="215" stroke="#e15c5c" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="315" cy="69" r="5" fill="#e15c5c"/>
  <text x="220" y="59" font-size="11" fill="#c0392b" font-weight="600">Vendita anticipata (99,12)</text>
  <text x="295" y="228" font-size="10" fill="#57606a">+200 gg</text>

  <!-- Punto rimborso a scadenza -->
  <line x1="530" y1="18" x2="530" y2="215" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="530" cy="18" r="5" fill="#22c55e"/>
  <text x="430" y="36" font-size="11" fill="#16a34a" font-weight="600">Rimborso (100)</text>
  <text x="505" y="228" font-size="10" fill="#57606a">Scad.</text>

  <!-- Etichette assi -->
  <text x="292" y="248" text-anchor="middle" font-size="12" fill="#57606a">Tempo</text>
  <text x="14" y="120" text-anchor="middle" font-size="12" fill="#57606a" transform="rotate(-90,14,120)">Prezzo (&#8364;)</text>

</svg>
